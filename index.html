<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apna Bill</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172334;font:16px system-ui}header{background:#123c6a;color:white;padding:22px}main{max-width:900px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001}h1{margin:0}h2{font-size:18px}.muted{color:#607080;font-size:14px}.row{display:flex;gap:8px}.row>*{flex:1}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd5e1;width:100%;margin:5px 0}button{background:#1465b8;color:white;border:0;cursor:pointer}@media(max-width:560px){.cards{grid-template-columns:1fr}}</style><header><h1>Apna Bill</h1><div>Simple billing for your business</div></header><main><section class="cards"><div class="card"><div class="muted">Demo total</div><h2 id="total">₹0.00</h2></div><div class="card"><div class="muted">Invoices saved</div><h2 id="count">0</h2></div></section><div class="card"><h2>Create demo invoice</h2><input id="business" placeholder="Business name"><input id="customer" placeholder="Customer name"><input id="item" placeholder="Item name"><div class="row"><input id="qty" type="number" min="1" value="1" placeholder="Qty"><input id="rate" type="number" min="0" value="0" placeholder="Rate ₹"></div><div class="row"><input id="discount" type="number" min="0" value="0" placeholder="Discount ₹"><select id="gst"><option value="0">GST off</option><option value="5">GST 5%</option><option value="12">GST 12%</option><option value="18">GST 18%</option><option value="28">GST 28%</option></select></div><button onclick="saveInvoice()">Save demo invoice</button><p id="preview" class="muted"></p></div><div class="card"><h2>Recent invoices</h2><div id="list"></div></div><p class="muted">Demo only; stored in this browser. Not an official bill or production software.</p></main><script>const storeKey='apnaBillDemo';function getData(){return JSON.parse(localStorage.getItem(storeKey)||'[]')}function calc(){let subtotal=Math.max(0,(Number(qty.value)||0)*(Number(rate.value)||0)-(Number(discount.value)||0));return subtotal*(1+(Number(gst.value)||0)/100)}function updatePreview(){preview.textContent='Estimated total: ₹'+calc().toFixed(2)}['qty','rate','discount','gst'].forEach(k=>document.getElementById(k).addEventListener('input',updatePreview));function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveInvoice(){const d=getData();d.unshift({business:business.value,customer:customer.value,item:item.value,amount:calc(),date:new Date().toLocaleString()});localStorage.setItem(storeKey,JSON.stringify(d));render()}function render(){const d=getData();count.textContent=d.length;total.textContent='₹'+d.reduce((sum,x)=>sum+x.amount,0).toFixed(2);list.innerHTML=d.slice(0,8).map(x=>'<p><b>'+safe(x.customer||'Walk-in')+'</b> — '+safe(x.item||'Item')+' ₹'+x.amount.toFixed(2)+' <small>'+safe(x.date)+'</small></p>').join('')||'Nothing saved yet.'}render();updatePreview();</script></html>
