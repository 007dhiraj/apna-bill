<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c6a"><title>Apna Bill — Billing Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#172334;font:15px system-ui}header{background:linear-gradient(120deg,#123c6a,#1976b9);color:white;padding:18px 16px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#dbeafe}main{max-width:1000px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border-radius:16px;padding:16px;box-shadow:0 2px 14px #14264f0d;margin-bottom:12px}.stat{font-size:12px;color:#64748b}.statval{font-size:23px;font-weight:700;margin-top:5px}h2{font-size:18px;margin:0 0 12px}label{font-size:13px;color:#526175;display:block}input,select,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #cbd5e1;background:white;width:100%;margin:4px 0 8px}button{border:0;background:#1768ad;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e7f0fa;color:#144c7e}button.danger{background:#fee2e2;color:#991b1b}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.itemrow{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:6px;align-items:center}.itemrow button{padding:8px;margin:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid #e6edf5}.table th{color:#66758a}.totals{max-width:360px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:5px}.total{font-size:20px;font-weight:800;border-top:1px solid #ccd7e4;padding-top:8px}.muted{font-size:12px;color:#64748b}.bill-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.itemrow{grid-template-columns:1fr .7fr 1fr auto}.card{padding:13px}.table{font-size:12px}}@media print{body{background:white}header,.no-print,.grid,.recent{display:none!important}main{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0}#invoicePreview{display:block!important}}
</style></head>
<body><header><h1>Apna Bill</h1><p>Simple billing for your business · Demo version</p></header><main>
<section class="grid"><div class="card"><div class="stat">Sales recorded (demo)</div><div class="statval" id="sales">₹0</div></div><div class="card"><div class="stat">Bills saved</div><div class="statval" id="billCount">0</div></div><div class="card"><div class="stat">Last bill amount</div><div class="statval" id="lastBill">₹0</div></div></section>
<section class="card no-print"><h2>Create invoice</h2><div class="row"><div><label>Business / Shop name</label><input id="shop" placeholder="Your business name"></div><div><label>Customer</label><input id="customer" placeholder="Customer name"></div></div><div class="row"><div><label>Invoice number</label><input id="invoiceNo"></div><div><label>Date</label><input id="date" type="date"></div></div>
<label>Item name</label><input id="itemName" placeholder="Product / service"><div class="row"><div><label>Qty</label><input id="qty" type="number" min="0.01" step="0.01" value="1"></div><div><label>Rate (₹)</label><input id="rate" type="number" min="0" step="0.01" value="0"></div></div>
<button id="addItem">+ Add item to bill</button><div id="cart"></div><div class="row"><div><label>Discount (₹)</label><input id="discount" type="number" min="0" step="0.01" value="0"></div><div><label>Extra charges (₹)</label><input id="charges" type="number" min="0" step="0.01" value="0" placeholder="Delivery / packing"></div></div><div class="row"><div><label>GST</label><select id="gst"><option value="0">GST Off</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></div><div><label>Payment type</label><select id="payment"><option>Cash</option><option>UPI</option><option>Credit</option><option>Bank</option></select></div></div><div class="totals" id="totals"></div><div class="row"><button id="save">Save bill</button><button class="secondary" id="print">Print / Save PDF</button></div></section>
<section class="card hide" id="invoicePreview"></section><section class="card recent no-print"><h2>Recent saved bills</h2><div id="recent"></div><button class="secondary" id="export">Export demo data (JSON)</button></section>
<p class="muted">Prototype only: data stays in this browser/device. No login, cloud sync, statutory invoice compliance or APK in this demo.</p></main>
<script>
const KEY='apnaBillV2';let cart=[];let invoices=JSON.parse(localStorage.getItem(KEY)||'[]');const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('date').value=new Date().toISOString().slice(0,10);$('invoiceNo').value='AB-'+Date.now().toString().slice(-6);
function subtotal(){return cart.reduce((a,x)=>a+x.qty*x.rate,0)}function calc(){let sub=subtotal(),disc=Math.max(0,Number($('discount').value)||0),ch=Math.max(0,Number($('charges').value)||0),taxable=Math.max(0,sub-disc+ch),tax=taxable*(Number($('gst').value)||0)/100;return {sub,disc,ch,taxable,tax,total:taxable+tax}}
function draw(){ $('cart').innerHTML=cart.length?'<table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody>'+cart.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+money(x.qty*x.rate)+'</td><td><button class="danger" data-remove="'+i+'">×</button></td></tr>').join('')+'</tbody></table>':'<p class="muted">No items added yet.</p>';cart.forEach((x,i)=>{});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.remove),1);draw()});let c=calc();$('totals').innerHTML='<div><span>Subtotal</span><b>'+money(c.sub)+'</b></div><div><span>Discount</span><b>- '+money(c.disc)+'</b></div><div><span>Extra charges</span><b>'+money(c.ch)+'</b></div><div><span>Taxable</span><b>'+money(c.taxable)+'</b></div><div><span>GST ('+$('gst').value+'%)</span><b>'+money(c.tax)+'</b></div><div class="total"><span>Total</span><b>'+money(c.total)+'</b></div>'}
$('addItem').onclick=()=>{let name=$('itemName').value.trim(),qty=Number($('qty').value),rate=Number($('rate').value);if(!name||qty<=0||rate<0){alert('Enter item, valid quantity and rate.');return}cart.push({name,qty,rate});$('itemName').value='';$('qty').value=1;$('rate').value=0;draw()};
['discount','charges','gst'].forEach(id=>$(id).addEventListener('input',draw));draw();
function billObj(){let c=calc();return {id:$('invoiceNo').value||'AB-'+Date.now(),date:$('date').value,shop:$('shop').value,customer:$('customer').value,items:cart.map(x=>({...x})),...c,gstRate:Number($('gst').value),payment:$('payment').value}}
$('save').onclick=()=>{if(!cart.length){alert('Add at least one item first.');return}let b=billObj();invoices.unshift(b);localStorage.setItem(KEY,JSON.stringify(invoices));cart=[];$('invoiceNo').value='AB-'+Date.now().toString().slice(-6);draw();render();preview(b);alert('Bill saved on this device.')};
function preview(b){$('invoicePreview').classList.remove('hide');$('invoicePreview').innerHTML='<div class="bill-head"><div><h2>'+esc(b.shop||'Business')+'</h2><div>Customer: '+esc(b.customer||'Walk-in')+'</div></div><div><b>Invoice '+esc(b.id)+'</b><div>'+esc(b.date)+'</div></div></div><hr><table class="table"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+b.items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+money(x.qty*x.rate)+'</td></tr>').join('')+'</tbody></table><div class="totals"><div>Subtotal <b>'+money(b.sub)+'</b></div><div>Discount <b>- '+money(b.disc)+'</b></div><div>Charges <b>'+money(b.ch)+'</b></div><div>GST <b>'+money(b.tax)+'</b></div><div class="total">Total <b>'+money(b.total)+'</b></div><div>Payment <b>'+esc(b.payment)+'</b></div></div><p>Thank you!</p>'}
function render(){let total=invoices.reduce((s,b)=>s+b.total,0);$('sales').textContent=money(total);$('billCount').textContent=invoices.length;$('lastBill').textContent=money(invoices[0]?.total||0);$('recent').innerHTML=invoices.slice(0,10).map(b=>'<p><b>'+esc(b.id)+'</b> · '+esc(b.customer||'Walk-in')+' · '+esc(b.date)+' · '+money(b.total)+' <button class="secondary" data-view="'+esc(b.id)+'">View</button></p>').join('')||'No bills saved.';document.querySelectorAll('[data-view]').forEach(btn=>btn.onclick=()=>preview(invoices.find(b=>b.id===btn.dataset.view)))}render();
$('print').onclick=()=>{if(cart.length){preview(billObj())}else if(invoices.length){preview(invoices[0])}else{alert('Create a bill first.');return}window.print()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(invoices,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='apna-bill-demo-backup.json';a.click();URL.revokeObjectURL(url)};
</script></body></html>
